name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # O projeto foi escrito e testado no Windows. Rodar a suite no mesmo SO
    # evita que um pressuposto de plataforma passe aqui e quebre no Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conferir encoding dos arquivos de texto
        # Caractere de substituicao ou ideograma CJK em arquivo de codigo
        # aparece como lixo no diff do GitHub. Falhar aqui e mais barato.
        run: python tools/verificar_encoding.py

      - name: Verificar que o pacote importa
        run: python -c "import netlab; print(netlab.__version__)"

      - name: O projeto valido passa com zero erro
        # Primeira metade do criterio de aceite.
        run: python -m netlab validar dados/projeto-predio.yaml

      - name: O projeto com erros falha com codigo 1
        # Segunda metade do criterio de aceite. O passo anterior falha se a
        # CLI devolver qualquer codigo diferente de 0.
        run: |
          python -m netlab validar dados/projeto-com-erros.yaml
          if ($LASTEXITCODE -ne 1) {
            Write-Error "esperava codigo de saida 1, veio $LASTEXITCODE"
            exit 1
          }

      - name: Rodar testes com cobertura
        # fail_under=70 esta no pyproject.toml; cobertura abaixo derruba o build.
        run: python -m pytest --cov=netlab --cov-report=term-missing --cov-report=xml

      - name: Conferir cobertura minima
        run: python -m coverage report --fail-under=70

      - name: Prova de aceite
        # Sobe as 12 regras contra os dois arquivos de projeto e exige que
        # cada uma detecte o caso plantado. E o teste que a suite nao cobre
        # sozinha: ela prova que cada funcao funciona, nao que os dois
        # arquivos que acompanham o repositorio se comportam como o README
        # promete.
        run: python tools/verificar_aceite.py

      - name: Conferir que os exemplos batem com o codigo
        # Regenera os exemplos e falha se houver diferenca. Um exemplo
        # desatualizado ensina o numero errado para quem le.
        run: |
          python tools/gerar_exemplos.py
          git diff --exit-code -- exemplos/